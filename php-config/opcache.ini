; OPcache configuration para servidores con recursos limitados
; Optimizado para reducir uso de memoria y mejorar rendimiento

[opcache]
; Habilitar OPcache
opcache.enable=1
opcache.enable_cli=0

; Memoria para OPcache (ajustar según PHP_MEMORY_LIMIT en .env)
; Para servidores pequeños: 32-64M es suficiente
opcache.memory_consumption=64
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
opcache.max_wasted_percentage=10

; Optimizaciones para recursos limitados
opcache.validate_timestamps=1
opcache.revalidate_freq=60
opcache.fast_shutdown=1

; Reducir fragmentación
opcache.consistency_checks=0
opcache.force_restart_timeout=180
