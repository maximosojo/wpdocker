; PHP configuration optimizada para servidores con recursos limitados
; Los valores se pueden ajustar en .env (PHP_MEMORY_LIMIT, PHP_MAX_EXECUTION_TIME, etc.)

; Límites de subida (64M recomendado en servidores de 2 GB RAM)
upload_max_filesize = 64M
post_max_size = 64M

; memory_limit se define en php-config/generated/99-memory.ini (generado por setup.sh)

; Timeouts (alineados con PHP_MAX_EXECUTION_TIME en .env)
max_execution_time = 300
max_input_time = 300

; Variables de entrada
max_input_vars = 5000

; Habilitar subida de archivos
file_uploads = On

; Optimizaciones adicionales para recursos limitados
realpath_cache_size = 2M
realpath_cache_ttl = 600
