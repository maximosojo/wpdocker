; PHP configuration optimizada para servidores con recursos limitados
; Los valores se pueden ajustar en .env (PHP_MEMORY_LIMIT, PHP_MAX_EXECUTION_TIME, etc.)

; Límites de subida (ajustar según necesidades)
upload_max_filesize = 64M
post_max_size = 64M

; Memoria PHP (ajustar según DOCKER_WP_MEMORY_LIMIT en .env)
; Valor por defecto para servidor pequeño: 128M
memory_limit = 128M

; Timeouts
max_execution_time = 300
max_input_time = 300

; Variables de entrada
max_input_vars = 5000

; Habilitar subida de archivos
file_uploads = On

; Optimizaciones adicionales para recursos limitados
realpath_cache_size = 2M
realpath_cache_ttl = 600
