# Nginx configuration - generado automáticamente por setup.sh
# Para modificar, edita nginx/nginx.conf.template y ejecuta setup.sh de nuevo

worker_processes 2;

events {
    worker_connections 512;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging optimizado
    access_log off;
    error_log /var/log/nginx/error.log warn;
    
    # Buffers aumentados para mejor rendimiento y evitar timeouts
    client_body_buffer_size 32k;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;
    client_max_body_size 64m;
    
    # Timeouts aumentados para evitar 504 (backend puede tardar)
    client_body_timeout 30;
    client_header_timeout 30;
    keepalive_timeout 30;
    send_timeout 30;
    
    # Compresión (ahorra ancho de banda)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";
    
    # Cache de archivos estáticos
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
    
    # Upstream con keepalive aumentado para mejor rendimiento
    upstream wordpress {
        server wordpress:80;
        keepalive 16;
    }

    # Configuración del servidor (HTTP y HTTPS)
    include /etc/nginx/conf.d/*.conf;
}