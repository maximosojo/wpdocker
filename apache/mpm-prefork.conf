# Límite de workers Apache para evitar OOM en contenedores con poca RAM.
# Con PHP_MEMORY_LIMIT=256M y contenedor de 512M caben ~2 peticiones PHP simultáneas.
<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 2
    ServerLimit 2
    MaxRequestWorkers 2
</IfModule>
