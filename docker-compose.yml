services:
  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-wpdocker}_wordpress_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress_db}
      MYSQL_USER: ${MYSQL_USER:-wordpress_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
    volumes:
      - wpdocker_db_data:/var/lib/mysql
      - ./backups/db:/backups
    restart: always
    command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-128M} --max-connections=${MYSQL_MAX_CONNECTIONS:-30} --tmp-table-size=${MYSQL_TMP_TABLE_SIZE:-16M} --max-heap-table-size=${MYSQL_MAX_HEAP_TABLE_SIZE:-16M} --innodb-log-file-size=48M --innodb-flush-log-at-trx-commit=2 --innodb-flush-method=O_DIRECT --performance-schema=OFF
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 90s
    networks:
      - wpdocker-wordpress-network
    deploy:
      resources:
        limits:
          cpus: '${DOCKER_MYSQL_CPU_LIMIT:-0.7}'
          memory: ${DOCKER_MYSQL_MEMORY_LIMIT:-320M}
        reservations:
          cpus: '${DOCKER_MYSQL_CPU_RESERVE:-0.3}'
          memory: ${DOCKER_MYSQL_MEMORY_RESERVE:-128M}

  wordpress:
    depends_on:
      db:
        condition: service_healthy
    image: wordpress:latest
    container_name: ${COMPOSE_PROJECT_NAME:-wpdocker}_wordpress_app
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST:-db:3306}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress_user}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress_db}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-false}
    volumes:
      - wpdocker_wp_data:/var/www/html
      - ./themes:/var/www/html/wp-content/themes
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./php-config/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini
      - ./backups/wp:/backups
    restart: always
    deploy:
      resources:
        limits:
          cpus: '${DOCKER_WP_CPU_LIMIT:-0.7}'
          memory: ${DOCKER_WP_MEMORY_LIMIT:-210M}
        reservations:
          cpus: '${DOCKER_WP_CPU_RESERVE:-0.3}'
          memory: ${DOCKER_WP_MEMORY_RESERVE:-105M}
    networks:
      - wpdocker-wordpress-network

  nginx:
    image: nginx:alpine
    container_name: ${COMPOSE_PROJECT_NAME:-wpdocker}_wordpress_nginx
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - wordpress
    networks:
      - wpdocker-wordpress-network
    deploy:
      resources:
        limits:
          cpus: '${DOCKER_NGINX_CPU_LIMIT:-0.4}'
          memory: ${DOCKER_NGINX_MEMORY_LIMIT:-90M}
        reservations:
          cpus: '${DOCKER_NGINX_CPU_RESERVE:-0.2}'
          memory: ${DOCKER_NGINX_MEMORY_RESERVE:-45M}

volumes:
  wpdocker_db_data:
  wpdocker_wp_data:

networks:
  wpdocker-wordpress-network:
    driver: bridge